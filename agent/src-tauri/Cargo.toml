[package]
name = "mermaid-agent"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.3" }

[dependencies]
axum = "0.7"
async-stream = "0.3"
futures = "0.3"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.3", features = ["tray-icon", "image-png"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
time = "0.3"
uuid = { version = "1.11", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["signal"] }
